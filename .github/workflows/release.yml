name: Release

# Builds SiteWatch on Windows and publishes a GitHub release with the
# installer and portable zip. Start it either way:
#  - push a version tag, for example v1.0.1, or
#  - Actions tab > Release > Run workflow (releases the version in package.json).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v. Bump the version first."
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - name: Build installer and portable zip
        shell: bash
        run: npx electron-builder --win nsis zip --x64 --publish never -c.win.signAndEditExecutable=true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SiteWatch ${{ steps.tag.outputs.name }}
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
          body: |
            **Download:** `SiteWatch Setup ….exe` installs SiteWatch for your user. `SiteWatch-…-win.zip` is the portable version: unzip it, move the folder somewhere permanent, and run `SiteWatch.exe`.

            The app isn't code-signed, so Windows SmartScreen asks first: click **More info → Run anyway**.
